server.port=8080
spring.application.name=api-gateway

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Habilitar enrutamiento automático mediante nombres registrados en Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Rutas explícitas hacia los microservicios
spring.cloud.gateway.routes[0].id=catalogo-route
spring.cloud.gateway.routes[0].uri=lb://CATALOGO-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/productos/**

spring.cloud.gateway.routes[1].id=importaciones-route
spring.cloud.gateway.routes[1].uri=lb://IMPORTACIONES-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/importaciones/**