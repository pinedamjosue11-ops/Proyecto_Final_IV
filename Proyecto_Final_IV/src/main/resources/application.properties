server.port=8081
spring.application.name=catalogo-service

# Configuración de base de datos db_catalogo
spring.datasource.url=jdbc:mysql://localhost:3306/db_catalogo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Conexión al servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Configuración explícita de Swagger / OpenAPI 3
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true