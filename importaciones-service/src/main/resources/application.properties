server.port=8082
spring.application.name=importaciones-service

# Configuración de base de datos db_importaciones
spring.datasource.url=jdbc:mysql://localhost:3306/db_importaciones?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Conexión al servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Servicio de catálogo: Eureka resuelve el nombre catalogo-service
catalogo.service.url=http://catalogo-service/api/v1/productos/lote

# Configuración explícita de Swagger / OpenAPI 3
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true